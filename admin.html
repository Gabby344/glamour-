<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Administration — Glamour</title><link rel="stylesheet" href="style.css">
<style>body{background:var(--k);color:#fff;padding:5rem 4vw 3rem}.box{max-width:780px;margin:auto;background:var(--k2);padding:1.4rem;border-radius:20px;margin-bottom:1.2rem}label{display:grid;gap:.3rem;margin:.7rem 0}input,select,textarea{width:100%;border-radius:12px;background:#0b0b0c;color:#fff;border:1px solid #fff3;padding:.7rem;font:inherit}.row{display:flex;gap:.6rem;align-items:center;border-bottom:1px solid #fff2;padding:.6rem 0}.row img{width:46px;height:46px;border-radius:10px;object-fit:cover}.row span{flex:1}.sm{padding:.4rem .9rem;font-size:.85rem}#msg{position:fixed;top:60px;left:0;right:0;text-align:center;background:var(--g);color:#000;padding:.6rem;z-index:30;font-weight:600}.tabs{display:flex;gap:.5rem;max-width:780px;margin:0 auto 1rem;overflow-x:auto}.tabs button{flex:none}</style></head><body>
<header class="nav"><a class="brand" href="index.html"><img src="images/logo.jpg" alt=""><span>Admin</span></a><button class="btn sm" id="out" style="margin-left:auto" hidden>Déconnexion</button></header><div id="msg" hidden></div>
<main id="login" class="box"><h2>Espace gérante</h2><form id="lf"><label>E-mail<input id="em" type="email" required></label><label>Mot de passe<input id="pw" type="password" required></label><button class="btn">Se connecter</button></form></main>
<div id="app" hidden><div class="tabs"><button class="chip on" data-t="a">Articles</button><button class="chip" data-t="r">Taux &amp; WhatsApp</button><button class="chip" data-t="v">Témoignages</button><button class="chip" data-t="l">Lookbook</button></div>
<section class="box" data-p="a"><h2 id="pt">Ajouter un article</h2><form id="pf"><input type="hidden" id="p-id"><label>Nom<input id="p-n" required></label><label>Catégorie<select id="p-c"></select></label><label>Genre (vêtements)<select id="p-g"><option value="">—</option><option>Femme</option><option>Homme</option><option>Mixte</option></select></label><label>Prix en USD<input id="p-u" type="number" step="any" required></label><label>Description<textarea id="p-d"></textarea></label><label>Étiquette (ex. Nouveau)<input id="p-b"></label><label>Photo (envoyée sur Firebase Storage)<input id="p-f" type="file" accept="image/*"></label><button class="btn">Enregistrer l’article</button> <button class="btn sm" type="button" id="pc" hidden>Annuler</button></form><h2 style="margin-top:1.5rem">Articles</h2><div id="list"></div></section>
<section class="box" data-p="r" hidden><h2>Taux &amp; WhatsApp</h2><form id="rf"><label>1 USD en CDF<input id="r-cdf" type="number" step="any" required></label><label>1 USD en ZMW<input id="r-zmw" type="number" step="any" required></label><label>Numéro WhatsApp des commandes (ex. 243970000000)<input id="r-wa" inputmode="tel"></label><button class="btn">Enregistrer</button></form></section>
<section class="box" data-p="v" hidden><h2>Témoignages vidéo</h2><form id="tf"><label>Nom<input id="t-n" required></label><label>Rôle (partenaire, cliente…)<input id="t-r"></label><label>Citation<textarea id="t-q"></textarea></label><label>Vidéo (fichier)<input id="t-f" type="file" accept="video/*"></label><label>… ou lien vidéo (YouTube ou .mp4)<input id="t-u" type="url"></label><button class="btn">Ajouter</button></form><div id="tl"></div></section>
<section class="box" data-p="l" hidden><h2>Lookbook — Relooking &amp; shooting</h2><form id="lf2"><label>Photo<input id="l-f" type="file" accept="image/*" required></label><label>Légende (ex. Didi — look cardigan)<input id="l-c"></label><label>Articles portés (facultatif)<input id="l-i"></label><button class="btn">Ajouter au lookbook</button></form><div id="ll"></div></section></div>
<script type="module" src="admin.js"></script></body></html>
