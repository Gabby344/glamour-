<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Administration — Glamour</title><link rel="stylesheet" href="style.css">
<style>body{background:var(--k);color:#fff;padding:5rem 4vw 3rem}.box{max-width:760px;margin:auto;background:var(--k2);padding:1.4rem;border-radius:20px;margin-bottom:1.2rem}label{display:grid;gap:.3rem;margin:.7rem 0}input,select,textarea{width:100%;border-radius:12px;background:#0b0b0c;color:#fff;border:1px solid #fff3;padding:.7rem;font:inherit}.row{display:flex;gap:.6rem;align-items:center;border-bottom:1px solid #fff2;padding:.6rem 0}.row img{width:46px;height:46px;border-radius:10px;object-fit:cover}.row span{flex:1}.sm{padding:.4rem .9rem;font-size:.85rem}#msg{position:fixed;top:60px;left:0;right:0;text-align:center;background:var(--g);color:#000;padding:.6rem;z-index:30;font-weight:600}</style></head><body>
<header class="nav"><a class="brand" href="index.html"><img src="images/logo.jpg" alt=""><span>Admin</span></a><button class="btn sm" id="out" style="margin-left:auto" hidden>Déconnexion</button></header><div id="msg" hidden></div>
<main id="login" class="box"><h2>Espace gérante</h2><form id="lf"><label>E-mail<input id="em" type="email" required></label><label>Mot de passe<input id="pw" type="password" required></label><button class="btn">Se connecter</button></form></main>
<main id="app" hidden>
<section class="box"><h2>Taux &amp; WhatsApp</h2><p style="color:#a79f92">1 USD = … (modifiable à tout moment)</p><form id="rf"><label>1 USD en CDF<input id="r-cdf" type="number" step="any" required></label><label>1 USD en ZMW<input id="r-zmw" type="number" step="any" required></label><label>Numéro WhatsApp des commandes (ex. 243970000000)<input id="r-wa" inputmode="tel"></label><button class="btn">Enregistrer</button></form></section>
<section class="box"><h2 id="pt">Ajouter un article</h2><form id="pf"><input type="hidden" id="p-id"><label>Nom<input id="p-n" required></label><label>Catégorie<select id="p-c"></select></label><label>Prix en USD<input id="p-u" type="number" step="any" required></label><label>Description<textarea id="p-d"></textarea></label><label>Étiquette (ex. Nouveau)<input id="p-b"></label><label>Photo<input id="p-f" type="file" accept="image/*"></label><button class="btn">Enregistrer l’article</button> <button class="btn sm" type="button" id="pc" hidden>Annuler</button></form></section>
<section class="box"><h2>Articles</h2><div id="list"></div></section></main>
<script type="module" src="admin.js"></script></body></html>
